# Solo para desarrollo del backend. El frontend corre desde su propio repo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: econnet
      POSTGRES_PASSWORD: econnet
      POSTGRES_DB: econnet
    ports: ["5432:5432"]
    volumes: ["datos:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econnet"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://econnet:econnet@db:5432/econnet
      NODE_ENV: development
      PORT: 3000
    env_file: [.env]
    ports: ["3000:3000"]

volumes:
  datos:
